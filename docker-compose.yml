version: "3.9"

services:
  postgis:
    image: postgis/postgis:16-3.4-alpine
    container_name: flipping_search_postgis
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flipping}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flipping_local_dev}
      POSTGRES_DB: ${POSTGRES_DB:-flipping_search}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-flipping} -d $${POSTGRES_DB:-flipping_search}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgis_data:
