name: Deploy to Hostinger VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install & Test
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build

      - name: Deploy via SSH to Hostinger VPS (if secrets are configured)
        if: ${{ secrets.VPS_HOST != '' && secrets.VPS_SSH_KEY != '' }}
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER || 'root' }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$VPS_PORT" -H "$VPS_HOST" >> ~/.ssh/known_hosts
          ssh -p "$VPS_PORT" "${VPS_USER}@${VPS_HOST}" "
            set -e
            if [ ! -d /opt/flipping-search-intelligence/.git ]; then
              git clone https://github.com/${{ github.repository }}.git /opt/flipping-search-intelligence
            fi
            cd /opt/flipping-search-intelligence
            git fetch origin main
            git reset --hard origin/main
            docker compose -f docker-compose.prod.yml up -d --build
          "
